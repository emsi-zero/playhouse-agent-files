notes: |
  Driver print: server Django templates (HTML preview) + pure ESC/POS text (stdlib) -> WebSocket print_receipt.
  No WeasyPrint/poppler. Driver: PILCHE_PRINTER_DEVICE for raw device write.
  POST print-via-driver body: receipt_variant (entry|exit), paper_size; visit data from DB.
  GET receipts/preview: same staff auth; query visit_id, receipt_variant, paper_size — returns receipt_html for UI iframe.
  Receipts: segno SVG data URI for HTML QR; Epson GS ( k native QR for ESC/POS; lang/locale query+body → fa|en via receipt_labels.py (no gettext .mo in repo).
  Receipts: DM Sans + Vazirmatn (Google Fonts) for HTML; en uses Babel medium Gregorian; fa uses jdatetime Jalali + Django TIME_ZONE for HTML and ESC/POS text. Exit label "Exit"; extra line only if extra_minutes > 0.
